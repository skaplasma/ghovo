name: APK Android

# Compila el APK en GitHub, sin depender de la cuota de EAS.
# Se lanza a mano desde la pestaña Actions (Run workflow) y deja el APK como artefacto.

on:
  # Se compila solo al subir cambios de la app: no depende del botón «Run workflow»,
  # que no aparece en todas las cuentas.
  push:
    branches: [main]
    paths:
      - 'App.tsx'
      - 'src/**'
      - 'assets/**'
      - 'app.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Rama o commit a compilar (vacío = la rama actual)'
        required: false
        default: ''

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Dependencias
        run: npm ci --no-audit --no-fund

      - name: Variables de entorno públicas
        run: |
          # Los valores públicos (URL y clave publicable de Supabase) ya están en el
          # ejemplo; sirven para que la app arranque con la cuenta configurada.
          cp .env.example .env
          APP_VERSION=$(grep -oP "version:'\K[0-9.]+" app.config.ts)
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Versión detectada: $APP_VERSION"

      - name: Generar el proyecto Android
        run: npx expo prebuild --platform android --no-install

      - name: Firmar con el keystore del proyecto
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          GHOVO_KEYSTORE: ${{ github.workspace }}/ghovo-release.jks
          GHOVO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GHOVO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GHOVO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$GHOVO_KEYSTORE"
          export GHOVO_KEYSTORE
          node tools/sign-release.mjs

      - name: Compilar el APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Porg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Localizar el APK
        id: apk
        run: |
          file=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          echo "ruta=$file" >> "$GITHUB_OUTPUT"
          ls -lh "$file"

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: GHOVO-${{ env.APP_VERSION }}-${{ github.sha }}
          path: ${{ steps.apk.outputs.ruta }}
          retention-days: 30

      - name: Resumen
        run: |
          {
            echo "### APK listo"
            echo ""
            echo "Versión **${{ env.APP_VERSION }}**, commit \`${{ github.sha }}\`"
            echo ""
            echo "Descárgalo en **Artifacts** (arriba a la derecha, en esta misma página del run)."
            echo ""
            echo "Firmado con la clave de depuración del entorno: para instalar una compilación nueva"
            echo "puede hacer falta desinstalar la anterior."
          } >> "$GITHUB_STEP_SUMMARY"
